# OpenWorker API 本地依赖：MySQL + Redis
# 使用方法:
#   1. 确认已复制 .env.example 为 .env（凭证与下方默认值一致）
#   2. 启动: pnpm docker:up   或  docker compose up -d
#   3. 停止: pnpm docker:down 或  docker compose down
#
# 与 services/langfuse-local 相互独立；容器名 / volume 均使用 openworker- 前缀。
# 若本机已占用 3306 / 6379，可在 .env 中覆盖 MYSQL_PORT / REDIS_PORT。

services:
  mysql:
    image: mysql:8.4
    container_name: openworker-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-openworker}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - openworker-mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${MYSQL_PASSWORD:-password}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: openworker-redis
    restart: unless-stopped
    # 与 .env.example 一致：默认无密码；若设置了 REDIS_PASSWORD 则启用 requirepass
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
        redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes;
      else
        redis-server --appendonly yes;
      fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - openworker-redis-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi'
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  openworker-mysql-data:
  openworker-redis-data:
